[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kdp-series-bible"
version = "0.1.0"
description = "Local-first CLI to build and maintain a KDP series bible: characters, settings, timelines, and series order, saved as Markdown/JSON."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Dylan Asdale", email = "dylanasdale@users.noreply.github.com" },
]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.scripts]
kdp = "kdp_series_bible.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
